<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMENARDI - Portail Chantier</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            max-width: 200px; 
            height: auto;
        }

        .forms-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }

        h2 { color: #333; font-size: 1.2rem; margin-bottom: 1rem; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background-color: white; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .status { text-align: center; margin-top: 10px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="AMENARDI Logo">
    </div>

    <div class="forms-container">
        <!-- Attendance Form -->
        <div class="card">
            <h2>📋 Pointage</h2>
            <form id="attendanceForm">
                <label>Photo de la feuille de présence</label>
                <input type="file" name="data" accept="image/*" multiple required>
                <button type="submit">Envoyer...</button>
            </form>
            <div id="attendanceStatus" class="status"></div>
        </div>

        <!-- Invoice Form (Updated Dropdown) -->
        <div class="card">
            <h2>🧾 Documents</h2>
            <form id="invoiceForm">
                <label>Type de document</label>
                <select name="doc_type" required>
                    <option value="" disabled selected>Choisissez le type...</option>
                    <option value="facture_achat">Factures d'achat</option>
                    <option value="bon_achat">Bons d'achat</option>
                    <option value="facture_vente">Factures de vente</option>
                    <option value="bon_vente">Bons de vente</option>
                    <option value="facture_avoir">Factures d'avoir</option>
                    <option value="bon_avoir">Bons d'avoir</option>
                    <option value="extracteur_de_texte">Extracteur de texte</option>
                </select>

                <label>Photo du document</label>
                <input type="file" name="data" accept="image/*" multiple required>
                <button type="submit" style="background: #28a745;">Envoyer...</button>
            </form>
            <div id="invoiceStatus" class="status"></div>
        </div>
    </div>

    <script>
        async function handleUpload(formId, statusId, webhookUrl) {
            const form = document.getElementById(formId);
            const status = document.getElementById(statusId);
            
            form.onsubmit = async (e) => {
                e.preventDefault();
                status.style.color = "black";
                status.innerText = "⏳ Submitting...";
                const formData = new FormData(form);

                try {
                    const response = await fetch(webhookUrl, { method: 'POST', body: formData });
                    if (response.ok) {
                        status.style.color = "green";
                        status.innerText = "✅ Sent successfully !";
                        form.reset();
                    } else { throw new Error(); }
                } catch (err) {
                    status.style.color = "red";
                    status.innerText = "❌ Error. Verify your connection.";
                }
            };
        }

        // Initialize the upload handlers
        handleUpload('attendanceForm', 'attendanceStatus', 'https://jaber-2121.app.n8n.cloud/webhook/amenardi-upload');
        handleUpload('invoiceForm', 'invoiceStatus', 'https://jaber-2121.app.n8n.cloud/webhook/updated-ocr');
    </script>
</body>
</html>
