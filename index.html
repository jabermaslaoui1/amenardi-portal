<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMENARDI - Portail Chantier</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            max-width: 200px; 
            height: auto;
        }

        .forms-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            /* Added: Centers inline elements like the status text */
            text-align: center; 
        }

        h2 { 
            color: #333; 
            font-size: 1.2rem; 
            margin-bottom: 1rem; 
            text-align: center; 
            border-bottom: 2px solid #007bff; 
            padding-bottom: 10px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            /* Updated: Centers the label text */
            text-align: center; 
        }

        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 1.2rem; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            background-color: white;
            /* Added: Centers the text inside text/select inputs where supported */
            text-align: center; 
            text-align-last: center; /* For Select dropdowns */
        }

        /* Special handling for file input to look more centered */
        input[type="file"] {
            cursor: pointer;
            line-height: 1.5;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.3s ease;
        }

        button:hover {
            filter: brightness(90%);
        }

        .status { 
            text-align: center; 
            margin-top: 15px; 
            font-size: 0.85rem; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="AMENARDI Logo">
    </div>

    <div class="forms-container">
        <div class="card">
            <h2>📋 Attendance</h2>
            <form id="attendanceForm">
                <label>Photo of the attendance sheet</label>
                <input type="file" name="data" accept="image/*" multiple required>
                <button type="submit">Send...</button>
            </form>
            <div id="attendanceStatus" class="status"></div>
        </div>

        <div class="card">
            <h2>🧾 Documents</h2>
            <form id="invoiceForm">
                <label>Type of Document</label>
                <select name="doc_type" required>
                    <option value="" disabled selected>Choose type...</option>
                    <option value="facture_achat">Factures d'achat</option>
                    <option value="bon_achat">Bons d'achat</option>
                    <option value="facture_vente">Factures de vente</option>
                    <option value="bon_vente">Bons de vente</option>
                    <option value="facture_avoir">Factures d'avoir</option>
                    <option value="bon_avoir">Bons d'avoir</option>
                    <option value="extracteur_de_texte">Extracteur de texte</option>
                </select>

                <label>Photo of the document</label>
                <input type="file" name="data" accept="image/*" multiple required>
                <button type="submit" style="background: #28a745;">Send...</button>
            </form>
            <div id="invoiceStatus" class="status"></div>
        </div>
    </div>

    <script>
        async function handleUpload(formId, statusId, webhookUrl) {
            const form = document.getElementById(formId);
            const status = document.getElementById(statusId);
            
            form.onsubmit = async (e) => {
                e.preventDefault();
                status.style.color = "black";
                status.innerText = "⏳ Submitting...";
                const formData = new FormData(form);

                try {
                    const response = await fetch(webhookUrl, { method: 'POST', body: formData });
                    if (response.ok) {
                        status.style.color = "green";
                        status.innerText = "✅ Sent successfully!";
                        form.reset();
                    } else { throw new Error(); }
                } catch (err) {
                    status.style.color = "red";
                    status.innerText = "❌ Error. Verify your connection.";
                }
            };
        }

        handleUpload('attendanceForm', 'attendanceStatus', 'https://jaber-357.app.n8n.cloud/webhook/amenardi-upload');
        handleUpload('invoiceForm', 'invoiceStatus', 'https://jaber-357.app.n8n.cloud/webhook/updated-ocr');
    </script>
</body>
</html>
